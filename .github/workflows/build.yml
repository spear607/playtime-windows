name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: ./build.ps1 -Package
      - name: Tests
        shell: powershell
        run: ./tests/test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Playtime-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
